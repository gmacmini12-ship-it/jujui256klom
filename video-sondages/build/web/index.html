<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B0F1A}
#bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 38%,#1b2540 0%,#0f1526 45%,#070a13 100%)}
#bgimg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;display:none;transform-origin:50% 40%}
#c{position:absolute;left:0;top:0}
#dim{position:absolute;inset:0;background:#070a13;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(7,10,19,.55) 0,rgba(7,10,19,0) 14%,rgba(7,10,19,0) 58%,rgba(7,10,19,.82) 80%,rgba(7,10,19,.95) 100%)}
#ov,#ui{position:absolute;inset:0}
#ov>div,#ui>div{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.A{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.5px;line-height:1.02}
.sub{font-family:Anton;text-transform:uppercase;font-size:96px;color:#F1FAEE;text-align:center;line-height:1.04;letter-spacing:1px;
  -webkit-text-stroke:14px #070a13;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.45)}
.sub b{color:#FF4B57;font-weight:400}
.src{font-family:Inter,sans-serif;font-size:25px;font-weight:500;color:#cfd6e6;white-space:normal!important;width:800px;line-height:1.25;
  padding:10px 16px 10px 14px;border-left:5px solid #E63946;background:rgba(7,10,19,.72);border-radius:0 8px 8px 0}
.src i{font-style:normal;color:#F4A261;font-weight:700;letter-spacing:1px;margin-right:8px;font-size:21px}
.lbl{font-family:Anton;text-transform:uppercase;font-size:50px;color:#F1FAEE;letter-spacing:1px;-webkit-text-stroke:9px #0B0F1A;paint-order:stroke fill;text-align:center;line-height:1}
.lbl.dark{color:#0B0F1A;-webkit-text-stroke:0}
.lbl.s{font-size:36px}.lbl.xs{font-size:34px;-webkit-text-stroke:7px #0B0F1A}.lbl.l{font-size:66px}
.lbl.red{color:#FF4B57}.lbl.amb{color:#F4A261}
.chip{font-family:Anton;text-transform:uppercase;font-size:44px;color:#0B0F1A;background:#F1FAEE;padding:10px 24px 8px;border-radius:10px;box-shadow:0 10px 0 rgba(0,0,0,.4);letter-spacing:1px}
.chip.red{background:#E63946;color:#fff}.chip.amb{background:#F4A261}.chip.navy{background:#1F2A44;color:#F1FAEE;border:3px solid #3b4a72}
.chip.big{font-size:74px;padding:16px 34px 12px}.chip.sm{font-size:32px;padding:8px 18px 6px}
.stamp{font-family:Anton;text-transform:uppercase;font-size:84px;color:#FF4B57;border:10px solid #FF4B57;padding:10px 34px 4px;border-radius:14px;letter-spacing:3px;background:rgba(7,10,19,.55)}
.card{font-family:Inter,sans-serif;background:#F1FAEE;color:#0B0F1A;border-radius:22px;padding:34px 40px;box-shadow:0 18px 0 rgba(0,0,0,.45);white-space:normal!important}
.card h1{font-family:Anton;font-weight:400;text-transform:uppercase;font-size:54px;margin:0 0 6px;letter-spacing:1px;line-height:1.05}
.card h2{font-size:28px;font-weight:600;margin:0 0 18px;color:#4a5677}
.card .row{font-size:36px;font-weight:700;margin:14px 0;display:flex;align-items:center;gap:18px}
.card .row s{display:inline-block;width:44px;height:44px;border-radius:10px;background:#E63946;color:#fff;text-decoration:none;font-family:Anton;text-align:center;line-height:46px;font-size:30px;flex:none}
.q{font-family:Anton;text-transform:uppercase;font-size:62px;color:#F1FAEE;background:#1F2A44;border:4px solid #3b4a72;border-left:18px solid #E63946;border-radius:16px;padding:22px 34px 16px 30px;width:900px;white-space:normal!important;line-height:1.05;box-shadow:0 14px 0 rgba(0,0,0,.45)}
.q em{font-style:normal;color:#F4A261;margin-right:18px}
.num{font-family:Anton;font-size:190px;color:#F1FAEE;-webkit-text-stroke:16px #0B0F1A;paint-order:stroke fill;letter-spacing:2px;line-height:.95;text-align:center}
.num small{display:block;font-size:54px;color:#F4A261;letter-spacing:2px}
#bar{position:absolute;left:0;top:0;height:10px;background:#E63946;width:0}
#wipe{position:absolute;left:-40%;top:-10%;width:180%;height:120%;background:#070a13;transform:translateX(-120%) skewX(-12deg)}
</style></head>
<body>
<div id="bg"></div><img id="bgimg"><canvas id="c" width="1080" height="1920"></canvas>
<div id="dim"></div><div id="vig"></div><div id="ov"></div><div id="wipe"></div><div id="ui"></div><div id="bar"></div>
<script type="module" src="/web/main.js"></script>
</body></html>
