<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RÉMANENCE</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0424; overflow: hidden; }
      canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at center, rgba(10, 4, 30, 0.55), rgba(3, 2, 10, 0.92));
        color: #e8f6ff; font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center; cursor: pointer; user-select: none; z-index: 80;
      }
      #overlay.hidden { display: none; }
      #overlay h1 {
        margin: 0; font-size: clamp(36px, 7vw, 92px); letter-spacing: 0.18em; font-weight: 800;
        color: #fff; text-shadow: 0 0 12px #ff2bd6, 0 0 42px #ff2bd6, 0 0 90px #7a2bff;
      }
      #overlay .sub { color: #5ef2ff; letter-spacing: 0.4em; font-size: 14px; text-shadow: 0 0 10px #00e5ff; }
      #overlay .boutons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
      #overlay .go {
        padding: 12px 28px; border: 1px solid #5ef2ff; border-radius: 2px; background: transparent; color: #e8f6ff;
        font: inherit; letter-spacing: 0.25em; font-size: 15px; cursor: pointer;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.45) inset, 0 0 18px rgba(0, 229, 255, 0.35);
      }
      #overlay .go:hover { background: rgba(94, 242, 255, 0.12); }
      #overlay .go.secondaire { border-color: #c44bff; font-size: 13px; box-shadow: 0 0 14px rgba(196, 75, 255, 0.35) inset; }
      #overlay .etat { color: #ffd166; letter-spacing: 0.3em; font-size: 13px; min-height: 1em; }
      #overlay table { border-collapse: collapse; font-size: 14px; opacity: 0.85; margin-top: 8px; }
      #overlay td { padding: 3px 12px; text-align: left; }
      #overlay td:first-child { color: #ffd166; text-align: right; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.55); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
